apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: frontend-service:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: PRODUTO_SERVICE_URL
              value: http://produto-service:5001
            - name: PEDIDO_SERVICE_URL
              value: http://pedido-service:5002

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
  type: NodePort