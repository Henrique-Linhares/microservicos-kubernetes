<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokel Shop - Painel de Produtos</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <a href="/" class="brand-logo">Vokel<span>Shop</span></a>
            <nav class="nav-menu">
                <a href="/" class="nav-link active">Produtos</a>
                <a href="/pedidos" class="nav-link">Pedidos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="card">
            <h2>Cadastrar Produto</h2>
            <form id="formProduto">
                <input type="text" id="nome" placeholder="Nome do produto" required>
                <input type="text" id="descricao" placeholder="Descrição">
                <input type="number" id="preco" placeholder="Preço" step="0.01" required>
                <input type="number" id="estoque" placeholder="Estoque" required>
                <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
            </form>
        </section>

        <section class="grid-single">
            <div class="card">
                <h2>Produtos Cadastrados</h2>
                <div id="listaProdutos" class="lista"></div>
            </div>
        </section>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content card">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <h2 id="modalNome">Nome do Produto</h2>
                <p id="modalDescricao" class="product-description">Descrição do produto aqui...</p>
                <div class="product-details-box">
                    <p><strong>Preço:</strong> <span id="modalPreco" class="price-current">R$ 0,00</span></p>
                    <p><strong>Estoque Disponível:</strong> <span id="modalEstoque">0</span> unidades</p>
                </div>
                <a href="/pedidos" class="btn btn-accent" style="text-align: center; display: block; text-decoration: none;">Ir para Pedidos</a>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
